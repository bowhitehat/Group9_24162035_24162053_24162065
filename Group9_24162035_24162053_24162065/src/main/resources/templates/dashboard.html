<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: page(~{::main})}">
<main>
    <div class="hero">
        <p class="eyebrow text-white-50">HỆ THỐNG QUẢN LÝ ĐỀ TÀI</p>
        <h1>Trang tổng quan (Dashboard)</h1>
        <p class="mb-0">Chào mừng bạn đến với hệ thống quản lý đề tài sinh viên.</p>
    </div>
    
    <div class="row g-4 mt-1" sec:authorize="hasAnyRole('ADMIN')">
        <div class="col-md-4"><div class="card metric-card"><strong th:text="${userCount}">0</strong><span>Tài khoản</span></div></div>
        <div class="col-md-4"><div class="card metric-card"><strong th:text="${departmentCount}">0</strong><span>Bộ môn</span></div></div>
        <div class="col-md-4"><div class="card metric-card"><strong th:text="${periodCount}">0</strong><span>Đợt đăng ký</span></div></div>
    </div>

    <div class="row g-4 mt-1" sec:authorize="hasAnyRole('FACULTY_MANAGER')">
        <div class="col-md-4"><div class="card metric-card"><strong th:text="${periodCount}">0</strong><span>Đợt đang mở</span></div></div>
        <div class="col-md-4"><div class="card metric-card"><strong th:text="${pendingRegistrations}">0</strong><span>Đề tài chờ duyệt</span></div></div>
        <div class="col-md-4"><div class="card metric-card"><strong th:text="${userCount}">0</strong><span>Người dùng</span></div></div>
    </div>

    <div class="row g-4 mt-1" sec:authorize="hasRole('LECTURER')">
        <div class="col-md-6"><div class="card metric-card"><strong th:text="${advisingTopics}">0</strong><span>Đề tài hướng dẫn</span></div></div>
        <div class="col-md-6"><div class="card metric-card"><strong th:text="${reviewerAssignments}">0</strong><span>Nhiệm vụ phản biện</span></div></div>
    </div>

    <div class="row g-4 mt-1" sec:authorize="hasRole('STUDENT')">
        <div class="col-md-12"><div class="card metric-card"><strong th:text="${studentGroupStatus}">Chưa có nhóm</strong><span>Tình trạng sinh viên</span></div></div>
    </div>
</main>
</html>
