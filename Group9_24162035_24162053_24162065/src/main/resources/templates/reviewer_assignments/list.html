<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: page(~{::content})}">
<head><title>Danh sách phân công phản biện</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Phân công phản biện</h4>
        <a sec:authorize="hasRole('FACULTY_MANAGER')" th:href="@{/reviewer-assignments/create}" class="btn btn-primary">Thêm phân công</a>
    </div>
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Đề tài</th>
                    <th>Giảng viên PB</th>
                    <th>Ngày phân công</th>
                    <th>Hạn nộp</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="a : ${assignments}">
                    <td th:text="${a.topic.code + ' - ' + a.topic.title}"></td>
                    <td th:text="${a.reviewer.fullName}"></td>
                    <td th:text="${#temporals.format(a.assignedAt, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(a.deadline, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${a.status}"></td>
                    <td>
                        <form th:if="${a.status.name() != 'SUBMITTED' and a.status.name() != 'CANCELLED'}" th:action="@{/reviewer-assignments/{id}/cancel(id=${a.id})}" method="post">
                            <button class="btn btn-sm btn-danger" type="submit" onclick="return confirm('Bạn có chắc muốn hủy?')">Hủy</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
