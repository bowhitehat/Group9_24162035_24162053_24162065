<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::content})}">
<head>
    <title>Lịch sử Nộp Báo cáo</title>
</head>
<body>
<div th:fragment="content">
    <div class="mb-3">
        <a th:href="@{/registrations}" class="btn btn-sm btn-outline-secondary">&larr; Quay lại danh sách đăng ký</a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h4>Lịch sử Nộp Báo cáo</h4>
            <p class="mb-1"><strong>Đề tài:</strong> <span th:text="${registration.topic.title}"></span> (Mã: <span th:text="${registration.topic.code}"></span>)</p>
            <p class="mb-0"><strong>Nhóm thực hiện:</strong> <span th:text="${registration.studentGroup.leader.fullName}"></span></p>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Phiên bản</th>
                        <th>Người nộp</th>
                        <th>Tên tập tin</th>
                        <th>Kích thước</th>
                        <th>Ghi chú</th>
                        <th>Thời gian nộp</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="sub : ${submissions}">
                        <td><span class="badge bg-info text-dark" th:text="${'v' + sub.version}"></span></td>
                        <td th:text="${sub.submitter.fullName}"></td>
                        <td th:text="${sub.originalFileName}"></td>
                        <td th:text="${#numbers.formatDecimal(sub.fileSize / 1024.0, 1, 2) + ' KB'}"></td>
                        <td th:text="${sub.note}"></td>
                        <td th:text="${#temporals.format(sub.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <a th:href="@{/reports/download/{id}(id=${sub.id})}" class="btn btn-sm btn-primary">Tải báo cáo</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(submissions)}">
                        <td colspan="7" class="text-center py-4 text-muted">Chưa có bản nộp báo cáo nào</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
