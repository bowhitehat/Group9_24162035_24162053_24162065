<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: page(~{::content})}">
<head><title>Kết quả Đề tài</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Quản lý Kết quả Đề tài</h4>
    </div>
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Đề tài</th>
                    <th>Điểm tổng</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${results}">
                    <td th:text="${r.topic.code + ' - ' + r.topic.title}"></td>
                    <td th:text="${r.finalScore}"></td>
                    <td th:text="${r.status}"></td>
                    <td>
                        <form sec:authorize="hasRole('FACULTY_MANAGER')" th:action="@{/evaluations/topic/{id}/calculate(id=${r.topic.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-secondary">Tính/Cập nhật Điểm</button>
                        </form>
                        <form sec:authorize="hasRole('LECTURER')" th:if="${r.status.name() == 'PENDING_CONFIRMATION'}" th:action="@{/evaluations/topic/{id}/confirm(id=${r.topic.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-info text-white" onclick="return confirm('Chủ tịch xác nhận kết quả?')">Xác nhận</button>
                        </form>
                        <form sec:authorize="hasRole('FACULTY_MANAGER')" th:if="${r.status.name() == 'CONFIRMED'}" th:action="@{/evaluations/topic/{id}/publish(id=${r.topic.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-success" onclick="return confirm('Công bố cho sinh viên?')">Công bố</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
