<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::content})}">
<head>
    <title>Nhóm của tôi</title>
</head>
<body>
<div th:fragment="content">
    <h2 class="mb-4">Quản lý Nhóm Sinh viên</h2>

    <!-- Chọn đợt -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/groups/my-group}" method="get" class="row align-items-center">
                <div class="col-md-4">
                    <label class="form-label">Chọn Đợt Đăng ký</label>
                    <select name="periodId" class="form-select" onchange="this.form.submit()">
                        <option th:each="p : ${periods}" th:value="${p.id}" th:text="${p.name}" th:selected="${p.id == selectedPeriodId}"></option>
                    </select>
                </div>
            </form>
        </div>
    </div>

    <!-- Chưa có nhóm -->
    <div class="card" th:if="${group == null}">
        <div class="card-body text-center py-5">
            <h4 class="text-muted">Bạn chưa thuộc nhóm nào trong đợt đăng ký này</h4>
            <p class="text-secondary">Bạn có thể tạo nhóm mới và làm Trưởng nhóm.</p>
            <form th:if="${canCreateGroup}" th:action="@{/groups/create}" method="post">
                <input type="hidden" name="periodId" th:value="${selectedPeriodId}">
                <button type="submit" class="btn btn-success mt-2">+ Tạo Nhóm Mới</button>
            </form>
        </div>
    </div>

    <!-- Đã có nhóm -->
    <div class="card" th:if="${group != null}">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
            <h5 class="mb-0">Thông tin nhóm (Mã nhóm #<span th:text="${group.id}"></span>)</h5>
            <span class="badge bg-info" th:text="${group.members.size() + '/3 thành viên'}"></span>
        </div>
        <div class="card-body">
            <p><strong>Trưởng nhóm:</strong> <span th:text="${group.leader.fullName + ' (' + group.leader.username + ')'}"></span></p>

            <h6 class="mt-4 mb-3">Danh sách thành viên</h6>
            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>STT</th>
                        <th>Họ và Tên</th>
                        <th>Tên đăng nhập / MSSV</th>
                        <th>Vai trò</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m, iter : ${group.members}">
                        <td th:text="${iter.count}">1</td>
                        <td th:text="${m.member.fullName}"></td>
                        <td th:text="${m.member.username}"></td>
                        <td>
                            <span class="badge" th:classappend="${m.leader ? 'bg-primary' : 'bg-secondary'}" th:text="${m.leader ? 'Trưởng nhóm' : 'Thành viên'}"></span>
                        </td>
                        <td>
                            <div th:if="${removableMemberIds.contains(m.member.id)}">
                                <form th:action="@{/groups/remove-member}" method="post" class="d-inline">
                                    <input type="hidden" name="groupId" th:value="${group.id}">
                                    <input type="hidden" name="memberId" th:value="${m.member.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Bạn có chắc chắn muốn xóa thành viên này?')">Xóa</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Thêm thành viên nếu là trưởng nhóm và nhóm chưa đủ 3 người -->
            <div class="mt-4 border-top pt-3" th:if="${canAddMember}">
                <h6>Thêm thành viên mới</h6>
                <form th:action="@{/groups/add-member}" method="post" class="row g-2 align-items-center">
                    <input type="hidden" name="groupId" th:value="${group.id}">
                    <div class="col-md-4">
                        <input type="text" name="memberUsername" class="form-control" placeholder="Nhập tên đăng nhập / MSSV..." required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">+ Thêm</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
