<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::main})}"><main><h1 class="page-title">Quản lý tài khoản</h1><div class="row g-4"><div class="col-xl-4"><div class="card p-4"><h2 class="h5">Tạo tài khoản</h2><form th:action="@{/admin/users}" th:object="${userForm}" method="post"><input class="form-control mb-2" th:field="*{username}" placeholder="Tên đăng nhập"><input class="form-control mb-2" th:field="*{fullName}" placeholder="Họ và tên"><input class="form-control mb-2" th:field="*{email}" placeholder="Email"><input class="form-control mb-2" th:field="*{studentCode}" placeholder="MSSV (nếu có)"><select class="form-select mb-2" th:field="*{departmentId}"><option value="">Không chọn bộ môn</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.code+' · '+d.name}"></option></select><select class="form-select mb-2" th:field="*{roles}" multiple size="4"><option th:each="r:${roleNames}" th:value="${r}" th:text="${r}"></option></select><input class="form-control mb-3" th:field="*{password}" type="password" placeholder="Mật khẩu tối thiểu 8 ký tự"><button class="btn btn-primary w-100">Tạo tài khoản</button></form></div></div><div class="col-xl-8"><div class="card p-4"><form class="d-flex gap-2 mb-3"><input class="form-control" name="q" th:value="${q}" placeholder="Tìm tên hoặc tài khoản"><button class="btn btn-outline-primary">Tìm</button></form><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Tài khoản</th><th>Họ tên</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="u:${users}"><td th:text="${u.username}"></td><td><strong th:text="${u.fullName}"></strong><br><small th:text="${u.email}"></small></td><td><span class="badge text-bg-secondary me-1" th:each="r:${u.roles}" th:text="${r.name}"></span></td><td th:text="${u.enabled?'Hoạt động':'Đã khóa'}"></td><td><form th:action="@{'/admin/users/'+${u.id}+'/toggle'}" method="post"><button class="btn btn-sm btn-outline-danger" th:text="${u.enabled?'Khóa':'Mở'}"></button></form></td></tr></tbody></table></div></div></div></div></main></html>
