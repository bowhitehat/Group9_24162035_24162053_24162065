<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::main})}"><main><h1 class="page-title">Quản lý bộ môn</h1><div class="row g-4"><div class="col-lg-4"><div class="card p-4"><h2 class="h5">Thêm bộ môn</h2><form th:action="@{/admin/departments}" th:object="${departmentForm}" method="post"><input class="form-control mb-2" th:field="*{code}" placeholder="Mã bộ môn"><input class="form-control mb-2" th:field="*{name}" placeholder="Tên bộ môn"><textarea class="form-control mb-3" th:field="*{description}" placeholder="Mô tả"></textarea><button class="btn btn-primary w-100">Lưu</button></form></div></div><div class="col-lg-8"><div class="card p-4"><form class="d-flex gap-2 mb-3"><input class="form-control" name="q" th:value="${q}" placeholder="Tìm mã hoặc tên"><button class="btn btn-outline-primary">Tìm</button></form><table class="table"><thead><tr><th>Mã</th><th>Tên</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="d:${departments}"><td><strong th:text="${d.code}"></strong></td><td><span th:text="${d.name}"></span><br><small th:text="${d.description}"></small></td><td th:text="${d.active?'Đang dùng':'Ngừng dùng'}"></td><td><form th:action="@{'/admin/departments/'+${d.id}+'/toggle'}" method="post"><button class="btn btn-sm btn-outline-secondary" th:text="${d.active?'Ngừng':'Kích hoạt'}"></button></form></td></tr></tbody></table></div></div></div></main></html>
