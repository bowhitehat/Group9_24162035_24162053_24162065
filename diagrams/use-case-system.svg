ên</text><path d="M170 1330 L385 1365" class="line"/><path d="M170 1330 L755 1365" class="line"/><path d="M170 1330 L1125 1365" class="line"/><path d="M170 1330 L385 1500" class="line"/><path d="M170 1330 L755 1500" class="line"/><path d="M170 1330 L1125 1500" class="line"/><path d="M170 1434 L385 1500" class="line"/><path d="M170 1434 L755 1500" class="line"/><path d="M170 1434 L1125 1500" class="line"/><circle cx="145" cy="1305" r="11" fill="white" stroke="#27465f" stroke-width="2"/><path d="M145 1316v26m-21-16h42m-21 16l-19 22m19-22l19 22" fill="none" stroke="#27465f" stroke-width="2"/><text x="145" y="1386" text-anchor="middle" class="body">Trưởng nhóm</text><circle cx="145" cy="1409" r="11" fill="white" stroke="#27465f" stroke-width="2"/><path d="M145 1420v26m-21-16h42m-21 16l-19 22m19-22l19 22" fill="none" stroke="#27465f" stroke-width="2"/><text x="145" y="1490" text-anchor="middle" class="body">Thành viên nhóm</text><ellipse cx="550" cy="1365" rx="165" ry="46" class="uc"/><text x="550" y="1371" text-anchor="middle" class="body">Quản lý nhóm</text><ellipse cx="920" cy="1365" rx="165" ry="46" class="uc"/><text x="920" y="1371" text-anchor="middle" class="body">Đăng ký đề tài</text><ellipse cx="1290" cy="1365" rx="165" ry="46" class="uc"/><text x="1290" y="1371" text-anchor="middle" class="body">Nộp báo cáo</text><ellipse cx="550" cy="1500" rx="165" ry="46" class="uc"/><text x="550" y="1506" text-anchor="middle" class="body">Xem báo cáo của nhóm</text><ellipse cx="920" cy="1500" rx="165" ry="46" class="uc"/><text x="920" y="1506" text-anchor="middle" class="body">Xem điểm đã công bố</text><ellipse cx="1290" cy="1500" rx="165" ry="46" class="uc"/><text x="1290" y="1506" text-anchor="middle" class="body">Xem thông báo</text><text x="45" y="1655" class="note">* Trưởng khoa và trưởng bộ môn dùng chung FACULTY_MANAGER; chưa có phạm vi riêng theo bộ môn.</text><text x="45" y="1685" class="note">GV chỉ chấm đề tài được giao và không hướng dẫn đề tài đó. CHAIR là vai t