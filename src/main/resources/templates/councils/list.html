<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: page(~{::content})}">
<head><title>Quản lý Hội đồng</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Quản lý Hội đồng</h4>
        <a sec:authorize="hasRole('FACULTY_MANAGER')" th:href="@{/councils/create}" class="btn btn-primary">Tạo hội đồng mới</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Tên hội đồng</th>
                    <th>Đợt</th>
                    <th>Ngày báo cáo</th>
                    <th>Địa điểm</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${councils}">
                    <td th:text="${c.name}"></td>
                    <td th:text="${c.registrationPeriod.name}"></td>
                    <td th:text="${#temporals.format(c.reportDate, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${c.location}"></td>
                    <td>
                        <span th:if="${c.status.name() == 'DRAFT'}" class="badge bg-secondary">Nháp</span>
                        <span th:if="${c.status.name() == 'ACTIVE'}" class="badge bg-primary">Hoạt động</span>
                        <span th:if="${c.status.name() == 'COMPLETED'}" class="badge bg-success">Hoàn tất</span>
                        <span th:if="${c.status.name() == 'CANCELLED'}" class="badge bg-danger">Đã hủy</span>
                    </td>
                    <td>
                        <a th:href="@{/councils/{id}(id=${c.id})}" class="btn btn-sm btn-info text-white">Chi tiết</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
