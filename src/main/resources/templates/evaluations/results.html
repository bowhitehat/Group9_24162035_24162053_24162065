<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: page(~{::content})}">
<head><title>Kết quả Đề tài</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Quản lý kết quả đề tài</h4>
    </div>
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Đề tài</th>
                <th>Điểm tổng</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${results}">
                <td th:text="${r.topic.code + ' - ' + r.topic.title}"></td>
                <td th:text="${r.finalScore != null ? r.finalScore : 'Chưa có'}"></td>
                <td th:text="${r.status != null ? r.status : 'Chưa tính điểm'}"></td>
                <td>
                    <a th:href="@{/evaluations/topic/{id}/results(id=${r.topic.id})}" class="btn btn-sm btn-outline-primary">Chi tiết</a>
                    <form sec:authorize="hasRole('FACULTY_MANAGER')" th:if="${calculableTopicIds.contains(r.topic.id)}"
                          th:action="@{/evaluations/topic/{id}/calculate(id=${r.topic.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-primary"
                                th:text="${r.finalScore == null ? 'Tính điểm' : 'Tính lại'}"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
