<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: page(~{::content})}">
<head><title>Kết quả nhóm</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Kết quả đề tài của nhóm</h4>
        <form th:if="${not #lists.isEmpty(studentPeriods)}" th:action="@{/evaluations/my-result}" method="get" class="d-flex align-items-center gap-2">
            <label for="resultPeriod" class="text-nowrap mb-0">Đợt đăng ký:</label>
            <select id="resultPeriod" name="periodId" class="form-select form-select-sm" onchange="this.form.submit()">
                <option th:each="period : ${studentPeriods}"
                        th:value="${period.id}"
                        th:text="${period.name}"
                        th:selected="${period.id == selectedPeriodId}"></option>
            </select>
        </form>
    </div>

    <div class="alert alert-info" th:if="${result == null}">
        Chưa có kết quả được công bố cho bạn trong đợt này.
    </div>

    <div th:if="${result != null}">
        <div class="card mb-3">
            <div class="card-body">
                <p><strong>Đề tài:</strong> <span th:text="${result.topic.code + ' - ' + result.topic.title}"></span></p>
                <p><strong>Điểm trung bình:</strong> <span th:text="${result.finalScore}"></span></p>
                <p><strong>Trạng thái:</strong> <span th:text="${result.status}"></span></p>
            </div>
        </div>
        <h5>Điểm thành phần</h5>
        <div class="card mb-3" th:each="e : ${evaluations}">
            <div class="card-header" th:text="${e.evaluator.fullName + ' · ' + e.evaluationType + ' · ' + e.status}"></div>
            <div class="card-body">
                <p th:if="${e.comments != null}"><strong>Nhận xét:</strong> <span th:text="${e.comments}"></span></p>
                <ul>
                    <li th:each="s : ${e.scores}" th:text="${s.criterion.name + ': ' + s.score}"></li>
                </ul>
            </div>
        </div>
    </div>
</div>
</body>
</html>
