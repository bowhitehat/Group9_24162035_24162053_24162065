<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · Group 9</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="login-page"><img class="corner-logo school" th:src="@{/images/hcmute-logo.jpg}" alt="HCMUTE"><img class="corner-logo faculty" th:src="@{/images/fit-logo.webp}" alt="FIT HCMUTE"><main class="login-shell"><header class="text-center login-heading"><p class="school-name">TRƯỜNG ĐẠI HỌC CÔNG NGHỆ KỸ THUẬT TP.HCM</p><p class="faculty-name">KHOA CÔNG NGHỆ THÔNG TIN</p></header><section class="card login-card"><div class="topline"></div><div class="p-4 p-md-5"><p class="eyebrow">HỆ THỐNG QUẢN LÝ ĐỀ TÀI SINH VIÊN</p><h1>ĐĂNG NHẬP</h1><p class="text-secondary mb-4">Sử dụng tài khoản được cấp để truy cập theo đúng vai trò.</p><div th:if="${param.error}" class="alert alert-danger">Tên đăng nhập hoặc mật khẩu không đúng.</div><div th:if="${param.logout}" class="alert alert-success">Bạn đã đăng xuất an toàn.</div><form th:action="@{/login}" method="post"><label class="form-label" for="username">Tên đăng nhập</label><input class="form-control form-control-lg mb-3" id="username" name="username" required autofocus><label class="form-label" for="password">Mật khẩu</label><input class="form-control form-control-lg mb-4" id="password" name="password" type="password" required><button class="btn btn-primary btn-lg w-100">Đăng nhập</button></form><p class="demo-note mt-4 mb-0">Demo: admin · faculty · lecturer1 · student1</p></div></section></main></body></html>
