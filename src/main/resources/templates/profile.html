<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::main})}"><main><h1 class="page-title">Hồ sơ cá nhân</h1><div class="row g-4"><div class="col-lg-6"><div class="card p-4"><dl class="row mb-0"><dt class="col-4">Tài khoản</dt><dd class="col-8" th:text="${user.username}"></dd><dt class="col-4">Họ tên</dt><dd class="col-8" th:text="${user.fullName}"></dd><dt class="col-4">Email</dt><dd class="col-8" th:text="${user.email}"></dd><dt class="col-4">Vai trò</dt><dd class="col-8"><span class="badge text-bg-primary me-1" th:each="role:${user.roles}" th:text="${role.name}"></span></dd></dl></div></div><div class="col-lg-6"><div class="card p-4"><h2 class="h5">Đổi mật khẩu</h2><form th:action="@{/profile/password}" method="post"><input class="form-control mb-3" name="currentPassword" type="password" placeholder="Mật khẩu hiện tại" required><input class="form-control mb-3" name="newPassword" type="password" minlength="8" placeholder="Mật khẩu mới" required><button class="btn btn-primary">Cập nhật</button></form></div></div></div></main></html>
