<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: page(~{::content})}">
<head><title>Tạo thông báo</title></head>
<body>
<div th:fragment="content">
    <div class="mb-4">
        <h4>Tạo thông báo mới</h4>
    </div>
    <div class="card shadow-sm max-w-md">
        <div class="card-body p-4">
            <form th:action="@{/announcements/create}" method="post">
                <div class="mb-3">
                    <label class="form-label">Tiêu đề</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nội dung</label>
                    <textarea name="content" class="form-control" rows="5" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Đối tượng nhận (Bỏ trống = Tất cả)</label>
                    <input type="text" name="targetRoles" class="form-control" placeholder="VD: STUDENT,LECTURER">
                </div>
                <div class="mb-3">
                    <label class="form-label">Ngày hết hạn (Tuỳ chọn)</label>
                    <input type="datetime-local" name="expirationTime" class="form-control">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="publish" class="form-check-input" id="publishCheck" value="true">
                    <label class="form-check-label" for="publishCheck">Công bố ngay</label>
                </div>
                <button type="submit" class="btn btn-primary">Lưu thông báo</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
