<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: page(~{::content})}">
<head>
    <title>Chi tiết Đề tài</title>
</head>
<body>
<div th:fragment="content">
    <div class="mb-3">
        <a th:href="@{/topics}" class="btn btn-sm btn-outline-secondary">&larr; Quay lại danh sách</a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start border-bottom pb-3 mb-3">
                <div>
                    <h3 th:text="${topic.title}"></h3>
                    <div class="text-muted small">
                        Mã: <span th:text="${topic.code}" class="fw-bold"></span> | 
                        Đợt: <span th:text="${topic.registrationPeriod.name}"></span> |
                        Bộ môn: <span th:text="${topic.department != null ? topic.department.name : ''}"></span>
                    </div>
                </div>
                <div>
                    <span class="badge fs-6" th:classappend="${topic.status.name() == 'PUBLISHED' ? 'bg-success' : (topic.status.name() == 'APPROVED' ? 'bg-info' : (topic.status.name() == 'PENDING' ? 'bg-warning text-dark' : (topic.status.name() == 'REJECTED' ? 'bg-danger' : 'bg-secondary')))}" th:text="${topic.status}"></span>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <p><strong>Giảng viên đề xuất:</strong> <span th:text="${topic.proposer != null ? topic.proposer.fullName : ''}"></span></p>
                    <p><strong>Giảng viên hướng dẫn:</strong>
                        <span th:each="adv, iter : ${topic.advisors}">
                            <span th:text="${adv.fullName}"></span><span th:if="${!iter.last}">, </span>
                        </span>
                    </p>
                </div>
            </div>

            <div class="mb-4" th:if="${topic.description != null}">
                <h5>Mô tả đề tài</h5>
                <p class="text-break" th:text="${topic.description}"></p>
            </div>

            <div class="mb-4" th:if="${topic.requirement != null}">
                <h5>Yêu cầu</h5>
                <p class="text-break" th:text="${topic.requirement}"></p>
            </div>

            <div class="alert alert-danger" th:if="${topic.status.name() == 'REJECTED' && topic.rejectionReason != null}">
                <strong>Lý do từ chối:</strong> <span th:text="${topic.rejectionReason}"></span>
            </div>

            <!-- Thao tác cho Giảng viên -->
            <div sec:authorize="hasRole('LECTURER')" th:if="${topic.proposer != null && topic.proposer.username == #authentication.name}">
                <div class="d-flex gap-2" th:if="${topic.status.name() == 'DRAFT' || topic.status.name() == 'REJECTED'}">
                    <a th:href="@{/topics/edit/{id}(id=${topic.id})}" class="btn btn-warning">Chỉnh sửa</a>
                    <form th:action="@{/topics/submit/{id}(id=${topic.id})}" method="post">
                        <button type="submit" class="btn btn-primary" onclick="return confirm('Bạn có chắc chắn muốn gửi duyệt đề tài này?')">Gửi duyệt</button>
                    </form>
                </div>
            </div>

            <!-- Thao tác duyệt cho Khoa / Admin -->
            <div sec:authorize="hasAnyRole('FACULTY_MANAGER', 'ADMIN')" class="mt-3 border-top pt-3">
                <div class="d-flex gap-2" th:if="${topic.status.name() == 'PENDING'}">
                    <form th:action="@{/topics/approve/{id}(id=${topic.id})}" method="post">
                        <button type="submit" class="btn btn-success">Duyệt đề tài</button>
                    </form>
                    <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#rejectModal">Từ chối</button>
                </div>
                <div class="d-flex gap-2" th:if="${topic.status.name() == 'APPROVED'}">
                    <form th:action="@{/topics/publish/{id}(id=${topic.id})}" method="post">
                        <button type="submit" class="btn btn-info text-white">Công bố đề tài</button>
                    </form>
                </div>
            </div>

            <!-- Thao tác đăng ký cho Sinh viên (Trưởng nhóm) -->
            <div sec:authorize="hasRole('STUDENT')" class="mt-3 border-top pt-3" th:if="${topic.status.name() == 'APPROVED' || topic.status.name() == 'PUBLISHED'}">
                <form th:action="@{/registrations/register}" method="post" class="d-inline">
                    <input type="hidden" name="topicId" th:value="${topic.id}">
                    <input type="hidden" name="groupId" th:value="${groupId}"> <!-- Injected or selected -->
                    <button type="submit" class="btn btn-primary">Đăng ký đề tài này</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal từ chối -->
    <div class="modal fade" id="rejectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/topics/reject/{id}(id=${topic.id})}" th:object="${rejectForm}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Từ chối đề tài</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Lý do từ chối <span class="text-danger">*</span></label>
                            <textarea th:field="*{reason}" class="form-control" rows="3" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-danger">Xác nhận từ chối</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
