<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::content})}">
<head>
    <title>Đề xuất / Chỉnh sửa Đề tài</title>
</head>
<body>
<div th:fragment="content">
    <div class="card max-w-700 mx-auto">
        <div class="card-header bg-white py-3">
            <h4 class="card-title mb-0" th:text="${topicForm.id == null ? 'Đề xuất đề tài mới' : 'Chỉnh sửa đề tài'}"></h4>
        </div>
        <div class="card-body">
            <form th:action="${topicForm.id == null ? '/topics/create' : '/topics/edit/' + topicForm.id}" th:object="${topicForm}" method="post">
                <div class="mb-3">
                    <label class="form-label">Mã đề tài <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{code}" class="form-control" th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" placeholder="VD: DT001">
                    <div class="invalid-feedback" th:errors="*{code}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tên đề tài <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" placeholder="Tên đề tài...">
                    <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Đợt đăng ký <span class="text-danger">*</span></label>
                        <select th:field="*{registrationPeriodId}" class="form-select" th:classappend="${#fields.hasErrors('registrationPeriodId')} ? 'is-invalid'">
                            <option value="">-- Chọn đợt --</option>
                            <option th:each="p : ${periods}" th:value="${p.id}" th:text="${p.name}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{registrationPeriodId}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Bộ môn <span class="text-danger">*</span></label>
                        <select th:field="*{departmentId}" class="form-select" th:classappend="${#fields.hasErrors('departmentId')} ? 'is-invalid'">
                            <option value="">-- Chọn bộ môn --</option>
                            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{departmentId}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mô tả đề tài</label>
                    <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Mô tả nội dung chi tiết..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Yêu cầu</label>
                    <textarea th:field="*{requirement}" class="form-control" rows="3" placeholder="Yêu cầu kiến thức, kỹ năng..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Giảng viên hướng dẫn (Tối đa 2 giảng viên)</label>
                    <select th:field="*{advisorIds}" class="form-select" multiple size="4">
                        <option th:each="lec : ${lecturers}" th:value="${lec.id}" th:text="${lec.fullName + ' (' + lec.username + ')'}"></option>
                    </select>
                    <div class="form-text">Giữ phím Ctrl (hoặc Cmd) để chọn nhiều giảng viên.</div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/topics}" class="btn btn-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary">Lưu đề tài</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
