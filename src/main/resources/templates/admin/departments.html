<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::main})}"><main>
<h1 class="page-title">Quản lý bộ môn</h1><div class="row g-4">
<div class="col-lg-4"><div class="card p-4"><h2 class="h5">Thêm bộ môn</h2><form th:action="@{/admin/departments}" th:object="${departmentForm}" method="post"><div th:replace="~{admin/department-fields :: fields}"></div><button class="btn btn-primary w-100">Lưu</button></form></div></div>
<div class="col-lg-8"><div class="card p-4"><form class="d-flex gap-2 mb-3"><input class="form-control" name="q" th:value="${q}" placeholder="Tìm mã hoặc tên" aria-label="Tìm bộ môn"><button class="btn btn-outline-primary">Tìm</button></form>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Mã</th><th>Tên</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="d:${departments}"><td><strong th:text="${d.code}"></strong></td><td><span th:text="${d.name}"></span><br><small th:text="${d.description}"></small></td><td th:text="${d.active?'Đang dùng':'Ngừng dùng'}"></td><td><div class="d-flex gap-2 flex-wrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/departments/{id}/edit(id=${d.id})}">Sửa</a><form th:action="@{/admin/departments/{id}/toggle(id=${d.id})}" method="post"><button class="btn btn-sm btn-outline-secondary" th:text="${d.active?'Ngừng':'Kích hoạt'}"></button></form></div></td></tr>
</tbody></table></div></div></div></div></main></html>
