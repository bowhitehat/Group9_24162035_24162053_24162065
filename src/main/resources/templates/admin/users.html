<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::main})}"><main>
<h1 class="page-title">Quản lý tài khoản</h1><div class="row g-4">
<div class="col-xl-4"><div class="card p-4"><h2 class="h5">Tạo tài khoản</h2>
<form th:action="@{/admin/users}" th:object="${userForm}" method="post">
<div th:replace="~{admin/user-fields :: fields}"></div>
<label for="password" class="form-label">Mật khẩu ban đầu</label><input class="form-control mb-2" required minlength="8" autocomplete="new-password" th:errorclass="is-invalid" th:field="*{password}" type="password">
<p class="form-text">Tối thiểu 8 ký tự, tối đa 72 byte; lưu bằng BCrypt.</p><button class="btn btn-primary w-100">Tạo tài khoản</button>
</form></div></div>
<div class="col-xl-8"><div class="card p-4"><form class="d-flex gap-2 mb-3"><input class="form-control" name="q" th:value="${q}" placeholder="Tìm tên hoặc tài khoản" aria-label="Tìm tài khoản"><button class="btn btn-outline-primary">Tìm</button></form>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Tài khoản</th><th>Họ tên</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="u:${users}"><td th:text="${u.username}"></td><td><strong th:text="${u.fullName}"></strong><br><small th:text="${u.email}"></small><br><small th:text="${u.studentCode}"></small></td><td><span class="badge text-bg-secondary me-1" th:each="r:${u.roles}" th:text="${r.name}"></span></td><td th:text="${u.enabled?'Hoạt động':'Đã khóa'}"></td><td><div class="d-flex gap-2 flex-wrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/users/{id}/edit(id=${u.id})}">Sửa</a><form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post"><button class="btn btn-sm btn-outline-danger" th:text="${u.enabled?'Khóa':'Mở'}"></button></form></div></td></tr>
</tbody></table></div></div></div></div></main></html>
