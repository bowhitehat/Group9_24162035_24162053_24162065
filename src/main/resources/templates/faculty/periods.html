<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::main})}">
<main>
    <h1 class="page-title">Quản lý đợt đăng ký</h1>
    <div class="row g-4">
        <div class="col-xl-5"><div class="card p-4">
            <h2 class="h5">Tạo đợt mới</h2>
            <form th:action="@{/faculty/periods}" th:object="${periodForm}" method="post" data-period-form>
                <div th:replace="~{faculty/period-fields :: fields}"></div>
                <button class="btn btn-primary w-100 mt-3">Tạo đợt</button>
            </form>
        </div></div>
        <div class="col-xl-7"><div class="card p-4">
            <form class="row g-2 mb-3">
                <div class="col-md-5"><input class="form-control" name="q" th:value="${q}" placeholder="Tìm theo tên"></div>
                <div class="col"><select class="form-select" name="type"><option value="">Mọi loại</option><option th:each="t:${types}" th:value="${t}" th:text="${t}"></option></select></div>
                <div class="col"><select class="form-select" name="status"><option value="">Mọi trạng thái</option><option th:each="s:${statuses}" th:value="${s}" th:text="${s}"></option></select></div>
                <div class="col-auto"><button class="btn btn-outline-primary">Lọc</button></div>
            </form>
            <div class="list-group list-group-flush">
                <a class="list-group-item list-group-item-action px-0" th:each="p:${periods}" th:href="@{'/faculty/periods/'+${p.id}}">
                    <div class="d-flex justify-content-between"><strong th:text="${p.name}"></strong><span class="badge text-bg-primary" th:text="${p.status}"></span></div>
                    <small th:text="${p.type+' · SV: '+#temporals.format(p.studentStart,'dd/MM/yyyy HH:mm')+' — '+#temporals.format(p.studentEnd,'dd/MM/yyyy HH:mm')}"></small>
                </a>
                <p class="text-secondary" th:if="${#lists.isEmpty(periods)}">Chưa có đợt phù hợp.</p>
            </div>
        </div></div>
    </div>
    <script th:src="@{/js/period-form.js}" defer></script>
</main>
</html>
