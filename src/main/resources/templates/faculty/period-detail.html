<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::main})}"><main><div class="d-flex justify-content-between align-items-start"><div><p class="eyebrow">CHI TIẾT ĐỢT</p><h1 class="page-title" th:text="${period.name}"></h1></div><a class="btn btn-outline-primary" th:if="${period.status.name()=='DRAFT'}" th:href="@{'/faculty/periods/'+${period.id}+'/edit'}">Chỉnh sửa</a></div><div class="card p-4"><div class="row g-3"><div class="col-md-4"><small>Loại</small><p class="fw-bold" th:text="${period.type}"></p></div><div class="col-md-4"><small>Trạng thái</small><p><span class="badge text-bg-primary" th:text="${period.status}"></span></p></div><div class="col-md-4"><small>Ngày hội đồng</small><p th:text="${period.councilDate!=null?#temporals.format(period.councilDate,'dd/MM/yyyy'):'—'}"></p></div><div class="col-md-6"><small>Giảng viên</small><p th:text="${#temporals.format(period.lecturerStart,'dd/MM/yyyy HH:mm')+' — '+#temporals.format(period.lecturerEnd,'dd/MM/yyyy HH:mm')}"></p></div><div class="col-md-6"><small>Sinh viên</small><p th:text="${#temporals.format(period.studentStart,'dd/MM/yyyy HH:mm')+' — '+#temporals.format(period.studentEnd,'dd/MM/yyyy HH:mm')}"></p></div></div><hr><form class="d-flex gap-2 align-items-center" th:action="@{'/faculty/periods/'+${period.id}+'/status'}" method="post"><select class="form-select" name="status"><option th:each="s:${statuses}" th:value="${s}" th:text="${s}"></option></select><button class="btn btn-primary text-nowrap">Chuyển trạng thái</button></form></div></main></html>
