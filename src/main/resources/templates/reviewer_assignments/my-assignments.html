<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: page(~{::content})}">
<head><title>Nhiệm vụ phản biện</title></head>
<body>
<div th:fragment="content">
    <div class="mb-4">
        <h4>Nhiệm vụ phản biện của tôi</h4>
    </div>
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Đề tài</th>
                    <th>Hạn nộp</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="a : ${assignments}">
                    <td th:text="${a.topic.code + ' - ' + a.topic.title}"></td>
                    <td th:text="${#temporals.format(a.deadline, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${a.status}"></td>
                    <td>
                        <a th:href="@{/evaluations/topic/{id}?type=REVIEWER(id=${a.topic.id})}" class="btn btn-sm btn-primary">Chấm điểm</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
