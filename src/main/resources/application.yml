spring:
  application:
    name: group9-topic-management
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  thymeleaf:
    cache: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${PORT:8090}
  tomcat:
    max-swallow-size: 20MB
  error:
    whitelabel:
      enabled: false
management:
  health:
    mail:
      enabled: ${app.mail.enabled}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  base-url: ${APP_BASE_URL:http://localhost:8090}
  upload-dir: ${UPLOAD_DIR:./uploads}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    supabase-url: ${SUPABASE_URL:}
    supabase-bucket: ${SUPABASE_BUCKET:reports}
    supabase-key: ${SUPABASE_STORAGE_KEY:}
  demo-password: ${DEMO_PASSWORD:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@group9.local}
