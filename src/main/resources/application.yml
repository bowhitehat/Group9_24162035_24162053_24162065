spring:
  application:
    name: group9-topic-management
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${PORT:8090}
  tomcat:
    max-swallow-size: 20MB
  error:
    whitelabel:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  demo-password: ${DEMO_PASSWORD:}
